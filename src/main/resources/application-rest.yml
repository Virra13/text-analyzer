spring.application.name:
  text-analyzer

spring:
  main:
    web-application-type: servlet

  datasource:
    url: jdbc:h2:file:./data/text-analyzer
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console